<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VonCMS - Content Management System</title>

    <link rel="stylesheet" href="/skeleton.css" />
    <link rel="stylesheet" href="/fonts/inter/inter.css" />

    <!-- Theme Guard: Instant Dark Mode detection to prevent FOUC -->
    <script>
      (function () {
        try {
          const darkMode = localStorage.getItem('von_dark_mode') === 'true';
          if (darkMode) {
            document.documentElement.classList.add('dark');
          }

          const adminMarkerIndex = window.location.pathname.lastIndexOf('/admin');
          const adminPaletteScope =
            adminMarkerIndex >= 0 ? window.location.pathname.slice(0, adminMarkerIndex + 1) : '/';
          const adminPalette = localStorage.getItem(`von_admin_palette:${adminPaletteScope}`);
          if (['charcoal-blue', 'meadow-gold', 'harbour-amber'].includes(adminPalette)) {
            document.documentElement.dataset.adminPalette = adminPalette;
          }
        } catch {
          // Storage can be unavailable in hardened browser contexts.
        }
      })();
    </script>
    <style>
      /* Critical CSS to prevent FOUC before Tailwind loads */
      html {
        background-color: #f8fafc;
        color-scheme: light;
      }
      body {
        background-color: #f8fafc;
        color: #1e293b;
      }
      html.dark {
        background-color: #181819;
        color-scheme: dark;
      }
      html.dark body {
        background-color: #181819;
        color: #f1f5f9;
      }

      /* Keep this boot-loader block aligned with public/index.php. */
      .voncms-boot-canvas {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        background: inherit;
      }
      .voncms-loader-spinner {
        width: 26px;
        height: 26px;
        border: 2px solid #d8dce2;
        border-top-color: #64748b;
        border-radius: 50%;
        animation: voncms-loader-spin 900ms linear infinite;
      }
      html.dark .voncms-loader-spinner {
        border-color: #34343a;
        border-top-color: #b4b4bd;
      }
      .voncms-boot-spinner {
        opacity: 0;
        animation:
          voncms-loader-spin 900ms linear infinite,
          voncms-loader-reveal 160ms 300ms ease-out forwards;
      }
      @keyframes voncms-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes voncms-loader-reveal {
        to {
          opacity: 0.74;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .voncms-loader-spinner {
          animation: none;
        }
        .voncms-boot-spinner {
          opacity: 0.74;
        }
      }
    </style>
  </head>

  <body
    class="bg-slate-50 dark:bg-[#181819] text-slate-800 dark:text-slate-100 antialiased transition-colors duration-200"
  >
    <div id="root">
      <div class="voncms-boot-canvas" aria-hidden="true">
        <span class="voncms-loader-spinner voncms-boot-spinner"></span>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
